<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#6366f1">
  <meta name="description" content="Mi Tienda en Línea PWA">
  <title>Mi Tienda en Línea</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="img/icons/icon-192.png">
  <link rel="apple-touch-icon" href="img/icons/icon-192.png">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Estilos e Íconos -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- HEADER (CORREGIDO - SIN DUPLICAR) -->
  <header class="header">
    <div class="header-top">
      <h1 class="logo">
        <img src="img/icons/icon-192.png" alt="Logo" class="logo-img">
        <span>MiTienda</span>
      </h1>
      <div class="header-actions">
        <button class="icon-btn" id="searchBtn" aria-label="Buscar"><i class="fas fa-search"></i></button>
        <button class="icon-btn cart-btn" id="cartBtn" aria-label="Carrito">
          <i class="fas fa-shopping-cart"></i>
          <span class="cart-count" id="cartCount">0</span>
        </button>
      </div>
    </div>
    <div class="search-bar" id="searchBar">
      <input type="text" id="searchInput" placeholder="🔍 Buscar productos...">
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main>
    <section class="banner">
      <span class="banner-tag">✨ NUEVA COLECCIÓN</span>
      <h2>Moda que te inspira</h2>
      <p>Descubre las últimas tendencias con hasta 30% de descuento</p>
      <button class="btn-primary">Comprar ahora →</button>
    </section>

    <section class="section">
      <div class="section-header">
        <h3 class="section-title">Categorías</h3>
        <a href="#" class="section-link">Ver todas</a>
      </div>
      <div class="categories-grid" id="categoriesGrid"></div>
    </section>

    <section class="section">
      <div class="section-header">
        <h3 class="section-title">Productos destacados</h3>
        <a href="#" class="section-link">Ver más</a>
      </div>
      <div class="products-grid" id="productsGrid"></div>
    </section>
  </main>

  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav">
    <button class="nav-item active"><i class="fas fa-home"></i><span>Inicio</span></button>
    <button class="nav-item"><i class="fas fa-th-large"></i><span>Categorías</span></button>
    <button class="nav-item"><i class="fas fa-tag"></i><span>Ofertas</span></button>
    <button class="nav-item"><i class="fas fa-user"></i><span>Mi cuenta</span></button>
    <button class="nav-item" id="navCartBtn">
      <i class="fas fa-shopping-cart"></i><span>Carrito</span>
      <span class="nav-badge" id="navBadge" style="display:none;">0</span>
    </button>
  </nav>

  <!-- MODAL CARRITO -->
  <div class="modal" id="cartModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>🛒 Tu Carrito</h2>
        <button class="close-btn" id="closeCart">&times;</button>
      </div>
      <div id="cartItemsContainer"></div>
      <div class="cart-footer" id="cartFooter" style="display:none;">
        <div class="cart-summary">
          <div class="cart-summary-row"><span>Subtotal</span><span id="cartSubtotal">$0.00</span></div>
          <div class="cart-summary-row"><span>Envío</span><span id="cartShipping">$50.00</span></div>
          <div class="cart-total-row"><span>Total</span><span id="cartTotal">$0.00</span></div>
        </div>
        <button class="btn-full" id="checkoutBtn"><i class="fas fa-credit-card"></i> Pagar ahora</button>
        <button class="btn-full btn-whatsapp" id="whatsappBtn"><i class="fab fa-whatsapp"></i> Pedir por WhatsApp</button>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICACIÓN -->
  <div class="toast" id="toast"></div>

  <!-- Scripts -->
  <script src="app.js" defer></script>
  
  <script>
    // Registrar Service Worker para PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('✅ Service Worker registrado con éxito', reg))
          .catch(err => console.log('⚠️ Error al registrar SW:', err));
      });
    }
  </script>
</body>
</html>
